<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MeroHisab | Transactions</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="transactions">

  <div id="sidebarMount"></div>
  <div class="main">
    <div id="topbarMount"></div>
    <!-- txpage.js fills this in -->
    <main class="page" id="pageContent"></main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/store.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/txpage.js"></script>
  <script>
    /* Page settings – change these to customise this page */
    document.addEventListener('DOMContentLoaded', () => {
      const { npr } = UI;
      const { sum } = TxPage;

      TxPage.init({
        title: 'Transactions',
        subtitle: 'Everything that moved in and out of your shop.',
        noun: 'Transaction', entity: 'transaction', entityPlural: 'transactions',
        addLabel: 'New transaction',
        searchPlaceholder: 'Search description, customer or category',
        defaultRange: '30d',

        types: ['sale', 'credit', 'payment', 'expense'],
        columns: ['date', 'desc', 'type', 'customer', 'amount', 'status', 'actions'],

        primaryFilter: {
          field: 'type', allLabel: 'All types',
          options: [['sale', 'Sales'], ['credit', 'Credit'], ['payment', 'Payments'], ['expense', 'Expenses']]
        },

        form: {
          defaultType: 'sale',
          types: [['sale', 'Sale'], ['credit', 'Credit sale (udhar)'], ['payment', 'Payment received'], ['expense', 'Expense']]
        },

        // Summary cards (calculated from the rows that match the filters)
        summary: rows => {
          const moneyIn  = sum(rows, t => t.type === 'sale' || t.type === 'payment');
          const moneyOut = sum(rows, t => t.type === 'expense');
          const credit   = sum(rows, t => t.type === 'credit');
          const net      = moneyIn - moneyOut;
          const count = type => rows.filter(t => t.type === type).length;
          return [
            { label: 'Money in',  icon: 'bi-box-arrow-in-down', value: npr(moneyIn),  meta: 'Cash sales + payments received', metaIcon: 'bi-arrow-down-left' },
            { label: 'Money out', icon: 'bi-box-arrow-up',      value: npr(moneyOut), meta: `${count('expense')} expense${count('expense') === 1 ? '' : 's'}`, metaIcon: 'bi-arrow-up-right' },
            { label: 'Credit given', icon: 'bi-cash-coin',      value: npr(credit),   meta: `${count('credit')} credit sale${count('credit') === 1 ? '' : 's'}`, metaIcon: 'bi-clock' },
            { label: 'Net cash flow', icon: 'bi-wallet2',       value: (net < 0 ? '− ' : '') + npr(Math.abs(net)), meta: `${rows.length} transaction${rows.length === 1 ? '' : 's'} in view`, metaIcon: 'bi-list-ul' }
          ];
        }
      });
    });
  </script>
</body>
</html>
