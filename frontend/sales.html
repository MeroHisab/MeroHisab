<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MeroHisab | Sales</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="sales">

  <div id="sidebarMount"></div>
  <div class="main">
    <div id="topbarMount"></div>
    <main class="page" id="pageContent"></main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/store.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/txpage.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const { npr } = UI;
      const { sum } = TxPage;

      TxPage.init({
        title: 'Sales',
        subtitle: 'Every sale you record, cash and credit.',
        noun: 'Sale', entity: 'sale', entityPlural: 'sales',
        addLabel: 'New sale',
        searchPlaceholder: 'Search items or customers',
        defaultRange: '30d',

        types: ['sale', 'credit'],
        columns: ['date', 'desc', 'type', 'customer', 'amount', 'status', 'actions'],

        descColumn: 'Items',
        typeColumnLabel: 'Payment',
        typeLabels: { sale: 'Cash', credit: 'Credit' },
        statusLabels: { Completed: 'Paid', Pending: 'Unpaid' },

        primaryFilter: {
          field: 'type', allLabel: 'All payments',
          options: [['sale', 'Cash'], ['credit', 'Credit']]
        },

        form: {
          defaultType: 'sale',
          types: [['sale', 'Cash sale'], ['credit', 'Credit sale (udhar)']]
        },

        summary: rows => {
          const total  = sum(rows);
          const cash   = sum(rows, t => t.type === 'sale');
          const credit = total - cash;
          const n = rows.length;
          const share = v => (total ? Math.round((v / total) * 100) : 0) + '% of sales';
          return [
            { label: 'Total sales',  icon: 'bi-graph-up-arrow', value: npr(total),  meta: `${n} sale${n === 1 ? '' : 's'} in view`, metaIcon: 'bi-receipt' },
            { label: 'Cash sales',   icon: 'bi-cash-stack',     value: npr(cash),   meta: share(cash),   metaIcon: 'bi-pie-chart' },
            { label: 'Credit sales', icon: 'bi-cash-coin',      value: npr(credit), meta: share(credit), metaIcon: 'bi-pie-chart' },
            { label: 'Average sale', icon: 'bi-calculator',     value: npr(n ? Math.round(total / n) : 0), meta: 'Per sale', metaIcon: 'bi-clock' }
          ];
        }
      });
    });
  </script>
</body>
</html>
